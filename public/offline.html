<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Hors ligne · b2bpro.store</title>
    <style>
      :root { color-scheme: light; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #0f172a;
        text-align: center;
      }
      .card { max-width: 340px; }
      .logo {
        width: 76px;
        height: 76px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: linear-gradient(135deg, #059669, #34d399);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(5, 150, 105, 0.35);
      }
      h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 10px; }
      p { font-size: 15px; line-height: 1.55; color: #475569; margin-bottom: 24px; }
      button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 26px;
        border: 0;
        border-radius: 12px;
        background: #059669;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover { background: #047857; }
      button:active { transform: scale(0.98); }
      .hint { margin-top: 18px; font-size: 12.5px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg width="42" height="42" viewBox="0 0 64 64" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" aria-hidden="true">
          <path d="M10 12 V52" />
          <path d="M10 32 a10 10 0 1 1 0 20" />
          <path d="M27 32 a5.5 5.5 0 1 1 9.5 4 L28.5 52 H37" />
          <path d="M44 12 V52" />
          <path d="M44 32 a10 10 0 1 1 0 20" />
        </svg>
      </div>
      <h1>Vous êtes hors ligne</h1>
      <p>La plateforme b2bpro.store nécessite une connexion. Vos commandes et échanges restent intacts : ils vous attendent au retour du réseau.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
      <p class="hint">b2bpro.store · application installable</p>
    </main>
  </body>
</html>
