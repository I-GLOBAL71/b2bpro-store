name: Daily Blog Autonomous Editorial Pipeline

on:
  schedule:
    # 09h30 heure de Paris (08h30 UTC)
    - cron: '30 8 * * *'
    # 16h15 heure de Paris (15h15 UTC)
    - cron: '15 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Créneau à exécuter (matin ou apres-midi)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - matin
          - apres-midi

jobs:
  publish-daily-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Auto Daily Editorial Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_NEON: ${{ secrets.DATABASE_URL_NEON }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_STORE_ID: ${{ secrets.BLOB_STORE_ID }}
        run: |
          SLOT="${{ github.event.inputs.slot || 'auto' }}"
          echo "Exécution pour le créneau : $SLOT"
          bun run scripts/auto-daily-runner.ts --slot=$SLOT

      - name: Commit and push changes
        run: |
          git config --global user.name "b2bpro-editorial-bot"
          git config --global user.email "bot@b2bpro.store"
          git add data/blog/ public/img/blog/ db/custom.db docs/
          if git diff --staged --quiet; then
            echo "Aucune modification à commiter."
          else
            git commit -m "chore(blog): publication automatique quotidienne 100% S+ [skip ci]"
            git push origin main
          fi
